<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nöbet Sistemi - Giriş</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font: 14px/1.4 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
            background: #F3F4F6; color: #111827; min-height: 100vh;
            display: flex; align-items: center; justify-content: center; padding: 16px;
        }
        .login-container {
            background: #fff; padding: 32px 28px; border-radius: 12px; width: 100%; max-width: 380px;
            border: 1px solid #E5E7EB; box-shadow: 0 10px 30px rgba(0,0,0,.06);
        }
        .logo { margin-bottom: 24px; }
        .logo-icon { display: none; }
        .logo h1 { font-size: 20px; margin-bottom: 4px; }
        .logo p { color: #6B7280; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; color: #374151; font-weight: 600; font-size: 13px; }
        .form-group input {
            width: 100%; padding: 9px 11px; border: 1px solid #D1D5DB; border-radius: 6px; font: inherit;
        }
        .form-group input:focus { outline: 2px solid #BFDBFE; border-color: #2563EB; }
        .btn {
            width: 100%; padding: 10px; background: #2563EB; color: #fff; border: 0; border-radius: 6px;
            font: inherit; font-weight: 600; cursor: pointer; margin-top: 4px;
        }
        .btn:hover { background: #1D4ED8; }
        .error-message {
            background: #FEF2F2; color: #B91C1C; border: 1px solid #FECACA; padding: 10px 12px;
            border-radius: 6px; margin-bottom: 16px;
        }
        .help-text { margin-top: 20px; padding-top: 16px; border-top: 1px solid #E5E7EB; color: #6B7280; font-size: 13px; }
        .help-text a { color: #2563EB; }
        .loading { display: none; color: #6B7280; margin-top: 12px; text-align: center; }
        .loading.show { display: block; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <div class="logo-icon">🏥</div>
            <h1>Nöbet Sistemi</h1>
            <p>Acil Servis Nöbet Yönetimi</p>
        </div>

        <div id="error-container"></div>

        <form id="login-form">
            <div class="form-group">
                <label for="username">Kullanıcı adı</label>
                <input 
                    type="text" 
                    id="username"
                    placeholder="Kullanıcı adınızı girin"
                    required
                    autocomplete="username"
                />
            </div>

            <div class="form-group">
                <label for="password">Şifre</label>
                <input 
                    type="password" 
                    id="password"
                    placeholder="Şifrenizi girin"
                    required
                    autocomplete="current-password"
                />
            </div>

            <button type="submit" class="btn">Giriş Yap</button>
        </form>

        <div class="loading" id="loading">
            Giriş yapılıyor...
        </div>

        <div class="help-text">
            <p style="color: #6B7280; font-size: 0.9rem;">
                Şifrenizi mi unuttunuz? <a href="#">Yönetici ile iletişime geçin</a>
            </p>
        </div>
    </div>

    <script>
        const API_URL = '';  // Aynı domain kullan

        // Sayfa yüklenince oturum kontrolü
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch(`${API_URL}/api/check-auth`, {
                    credentials: 'include'
                });
                const data = await response.json();
                
                if (data.authenticated) {
                    // Zaten giriş yapılmış, yönlendir
                    if (data.role === 'admin') {
                        window.location.href = 'nobet_admin.html';
                    } else {
                        window.location.href = 'nobet_view.html';
                    }
                }
            } catch (err) {
                console.error('Auth kontrol hatası:', err);
            }
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorContainer = document.getElementById('error-container');
            const loading = document.getElementById('loading');
            
            // Hata mesajını temizle
            errorContainer.innerHTML = '';
            loading.classList.add('show');

            try {
                const response = await fetch(`${API_URL}/api/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();
                loading.classList.remove('show');

                if (data.success) {
                    // Başarılı giriş - role'e göre yönlendir
                    if (data.role === 'admin') {
                        window.location.href = 'nobet_admin.html';
                    } else {
                        window.location.href = 'nobet_view.html';
                    }
                } else {
                    // Hata göster
                    showError(data.message || 'Kullanıcı adı veya şifre hatalı');
                }
            } catch (err) {
                loading.classList.remove('show');
                showError('Sunucuya ulaşılamıyor. İnternet bağlantınızı kontrol edin.');
                console.error('Login hatası:', err);
            }
        });

        function showError(message) {
            const errorContainer = document.getElementById('error-container');
            errorContainer.innerHTML = '';
            const div = document.createElement('div');
            div.className = 'error-message';
            div.textContent = message;
            errorContainer.appendChild(div);
        }
    </script>
</body>
</html>
